# Align with macOS Simplified Pinyin behavior (a patch on top of rime_frost.schema.yaml).
#
# Differences from upstream:
# - Remove ; for selecting the second candidate (; commits directly as plain punctuation)
# - Remove the ` prefix for single-character reverse lookup and the / prefix for symbol input
#   (` / commit directly as plain punctuation)
# - Remove [ ] for selecting characters from a word ([ ] are plain punctuation; within a composition
#   they commit the candidate and append the symbol)
# - Remove the word-segmentation role of ' (' is plain punctuation; within a composition it commits
#   the candidate and appends the symbol)
# - Remove all prefix/keyword trigger modes: u character decomposition, U Unicode input,
#   R uppercase Chinese numerals, N Gregorian-to-Lunar conversion, V/v calculator, and rq/sj/xq/dt/ts/nl date/time lunar queries
# - direct_uppercase.lua: Shift/CapsLock + letter joins the composition when one is open, otherwise commits the uppercase letter directly
# - post_commit_reject.lua: after a candidate commits, consecutive Backspace deletes it fully; the next time the
#   same code is typed, the candidate moves back one position (one-shot); the processor must come first to observe all keys
patch:
  engine/processors:
    - lua_processor@*post_commit_reject*processor
    - lua_processor@*direct_uppercase
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  engine/segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor

  engine/translators:
    - punct_translator
    - script_translator
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - lua_translator@*force_gc

  engine/filters:
    - lua_filter@*is_in_user_dict
    - lua_filter@*corrector
    - lua_filter@*autocap_filter
    - lua_filter@*pin_cand_filter
    - lua_filter@*reduce_english_filter
    - simplifier@emoji
    - simplifier@chaifen
    - simplifier@chaifen_all
    - simplifier@chinese_english
    - simplifier@traditionalize
    - simplifier@mars
    - lua_filter@*post_commit_reject*reorder
    - uniquifier

  recognizer/patterns: {}

  # ascii_composer reads the original default.yaml at runtime (the preset path skips the compiled patch),
  # so noop must be written into the schema itself to take effect. If Caps_Lock were set to clear, the real
  # CapsLock passed through during held-uppercase would be interpreted by rime as the CN/EN switch, leaving
  # a stale English state where tapping only cycles between en/A; CapsLock handles caps lock only, and the
  # CN/EN switch is left to tapping.
  ascii_composer/switch_key:
    Caps_Lock: noop
    Control_L: noop
    Control_R: noop
    Shift_L: noop
    Shift_R: noop

  key_binder/bindings: []

  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA

  speller/delimiter: " "
