patch:
  engine/processors:
    # Observe every key before another processor can consume it.
    - lua_processor@*post_commit_reject*processor
    - lua_processor@*direct_uppercase
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  engine/segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor

  engine/translators:
    - punct_translator
    - script_translator
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - lua_translator@*force_gc

  engine/filters:
    - lua_filter@*is_in_user_dict
    - lua_filter@*corrector
    - lua_filter@*autocap_filter
    - lua_filter@*pin_cand_filter
    - lua_filter@*reduce_english_filter
    - simplifier@emoji
    - simplifier@chaifen
    - simplifier@chaifen_all
    - simplifier@chinese_english
    - simplifier@traditionalize
    - simplifier@mars
    - lua_filter@*post_commit_reject*reorder
    - uniquifier

  recognizer/patterns: {}

  # Keep the switch policy in the schema; ascii_composer reads the unpatched default preset.
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key:
    Caps_Lock: commit_code
    Eisu_toggle: commit_code
    Control_L: noop
    Control_R: noop
    Shift_L: noop
    Shift_R: noop

  key_binder/bindings:
    - { when: always, accept: Control+space, send: Eisu_toggle }
    - { when: always, accept: Control+F24, set_option: ascii_mode }

  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA

  speller/delimiter: " "
