[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-dotnix"
version = "0.1.0"
description = "Read-only NixOS MCP server for dotnix"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dotnix"]

[project.scripts]
mcp-dotnix = "mcp_dotnix.server:main"
